name: Build mdnest images

# Thin build pipeline: watches upstream mahsanamin/mdnest for releases and
# publishes images to Docker Hub under `dualfrostbeams`.
#
# Auto-BUILD only. Deployment is manual: the home Ansible role pins a specific
# tag and only changes when that pin is bumped deliberately.

on:
  schedule:
    # Daily at 03:17 UTC — off the top-of-hour queue rush.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream tag to build (e.g. v4.5.1). Empty = latest upstream release."
        required: false
        default: ""
      force:
        description: "Rebuild even if this tag already exists on Docker Hub"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-mdnest
  cancel-in-progress: false

env:
  UPSTREAM_REPO: mahsanamin/mdnest
  DH_NAMESPACE: dualfrostbeams

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      should_build: ${{ steps.resolve.outputs.should_build }}
      commit: ${{ steps.resolve.outputs.commit }}
      build_time: ${{ steps.resolve.outputs.build_time }}
    steps:
      - name: Resolve version and decide whether to build
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          # --- Which upstream tag? ---
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq .tag_name)"
          fi
          echo "Target upstream tag: ${VERSION}"

          # --- Commit SHA the tag points at (peels annotated tags) ---
          SHA="$(git ls-remote "https://github.com/${UPSTREAM_REPO}.git" \
                  "refs/tags/${VERSION}^{}" "refs/tags/${VERSION}" \
                | awk '{print $1}' | tail -n1)"
          if [ -z "$SHA" ]; then
            echo "::error::Tag ${VERSION} not found in ${UPSTREAM_REPO}"
            exit 1
          fi
          COMMIT="${SHA:0:7}"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # --- Already on Docker Hub? (public repos: no auth needed) ---
          backend_code="$(curl -s -o /dev/null -w '%{http_code}' \
            "https://hub.docker.com/v2/repositories/${DH_NAMESPACE}/mdnest-backend/tags/${VERSION}")"
          frontend_code="$(curl -s -o /dev/null -w '%{http_code}' \
            "https://hub.docker.com/v2/repositories/${DH_NAMESPACE}/mdnest-frontend/tags/${VERSION}")"

          SHOULD_BUILD=true
          REASON=""
          if [ "$backend_code" = "200" ] && [ "$frontend_code" = "200" ]; then
            if [ "$FORCE" = "true" ]; then
              REASON="tags already exist — rebuilding because force=true"
            else
              SHOULD_BUILD=false
              REASON="both tags already exist on Docker Hub — nothing to do"
            fi
          else
            REASON="missing tags (backend HTTP ${backend_code}, frontend HTTP ${frontend_code})"
          fi

          {
            echo "version=${VERSION}"
            echo "should_build=${SHOULD_BUILD}"
            echo "commit=${COMMIT}"
            echo "build_time=${BUILD_TIME}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## mdnest image build"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Upstream tag | \`${VERSION}\` |"
            echo "| Commit | \`${COMMIT}\` |"
            echo "| Decision | ${SHOULD_BUILD} — ${REASON} |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Decision: build=${SHOULD_BUILD} (${REASON})"

  build:
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            # Upstream bakes these into the Go binary so /api/config reports
            # the exact build. The frontend image consumes no build args.
            build_args: |
              GIT_COMMIT=${{ needs.resolve.outputs.commit }}
              BUILD_TIME=${{ needs.resolve.outputs.build_time }}
          - component: frontend
            build_args: ""
    steps:
      - name: Check out upstream at tag
        uses: actions/checkout@v7
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: refs/tags/${{ needs.resolve.outputs.version }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push mdnest-${{ matrix.component }}
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.component }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DH_NAMESPACE }}/mdnest-${{ matrix.component }}:${{ needs.resolve.outputs.version }}
            ${{ env.DH_NAMESPACE }}/mdnest-${{ matrix.component }}:latest
          build-args: ${{ matrix.build_args || null }}
          # Plain manifests, no provenance/SBOM attestations. Attested images
          # (OCI 1.1 manifest lists with unknown/unknown entries) can trip up
          # older Podman — the deployment target here — and upstream disables
          # attestations for its own builds too.
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max

  # Commits the built version to VERSION on every successful build. Doubles as
  # keep-alive: GitHub disables scheduled workflows in repos with no activity
  # for 60 days, and each build-commit resets that clock. Needs contents:write
  # (job-level override of the workflow's read-only default).
  record:
    needs: [resolve, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out build repo
        uses: actions/checkout@v7

      - name: Record built version
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          echo "${VERSION}" > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- VERSION; then
            echo "VERSION already ${VERSION} — nothing to commit"
            exit 0
          fi
          git add VERSION
          git commit -m "build: ${VERSION}"
          git push
